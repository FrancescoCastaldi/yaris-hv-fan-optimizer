name: Build Release APK & Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK & Run Unit Tests
        run: |
          gradle testReleaseUnitTest
          gradle assembleRelease

      - name: Copy Built APK to Distribution & Docs
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/release/app-release.apk YarisHvFanControl.apk
          cp app/build/outputs/apk/release/app-release.apk YarisHvFanControl-v2.9.3.apk
          cp app/build/outputs/apk/release/app-release.apk docs/YarisHvFanControl.apk
          cp app/build/outputs/apk/release/app-release.apk docs/YarisHvFanControl-v2.9.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YarisHvFanControl-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
